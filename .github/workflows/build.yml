name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/inventory
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            HTML_FILE=$(find . -maxdepth 3 -name "*.html" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" app/src/main/assets/index.html
            else
              echo "No HTML file found in repository"
              exit 1
            fi
          fi

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          echo "include ':app'" > settings.gradle

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.example.inventory'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.inventory"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="ERP Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/inventory/MainActivity.java
          package com.example.inventory;

          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Bypass Login Screen in assets/index.html
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          html_path = Path("app/src/main/assets/index.html")
          if html_path.exists():
              text = html_path.read_text(encoding="utf-8", errors="ignore")
              bypass_script = """
          <script>
          function unlockAccountingApp() {
            var loginScreen = document.getElementById("loginScreen");
            if (loginScreen) {
              loginScreen.style.display = "none";
              loginScreen.classList.add("hidden");
            }
            var morningModal = document.getElementById("morningModal");
            if (morningModal) {
              morningModal.style.display = "none";
              morningModal.classList.add("hidden");
            }
            var hiddenEls = document.querySelectorAll(".hidden");
            for (var i = 0; i < hiddenEls.length; i++) {
              var el = hiddenEls[i];
              if (el.id !== "loginScreen" && el.id !== "morningModal") {
                el.classList.remove("hidden");
              }
            }
          }
          document.addEventListener("DOMContentLoaded", unlockAccountingApp);
          window.addEventListener("load", unlockAccountingApp);
          window.login = function() {
            unlockAccountingApp();
          };
          </script>
          """
              if "</body>" in text:
                  text = text.replace("</body>", bypass_script + "\n</body>", 1)
              else:
                  text += bypass_script
              html_path.write_text(text, encoding="utf-8")
          EOF

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-pro-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
